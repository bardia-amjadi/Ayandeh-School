# Production: pulls published images from GHCR. No build tools needed on the server.
name: ayandeh
services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # no ports: database is not exposed

  migrate:
    image: ghcr.io/${IMAGE_OWNER:?}/ayandeh-school-api:${IMAGE_TAG:?}
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  api:
    image: ghcr.io/${IMAGE_OWNER}/ayandeh-school-api:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      UPLOAD_DIR: /app/uploads
      BACKUP_DIR: /app/backups
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      CLAMAV_HOST: ${CLAMAV_HOST:-}
      CLAMAV_FAIL_OPEN: ${CLAMAV_FAIL_OPEN:-false}
    volumes: [uploads:/app/uploads, backups:/app/backups]
    depends_on:
      migrate: { condition: service_completed_successfully }

  # Optional antivirus: `docker compose --profile antivirus up -d` and set CLAMAV_HOST=clamav in .env
  clamav:
    image: clamav/clamav:1.4
    profiles: [antivirus]
    restart: unless-stopped
    volumes: [clamdb:/var/lib/clamav]
    healthcheck: { test: ["CMD", "clamdcheck.sh"], interval: 30s, timeout: 10s, retries: 10, start_period: 120s }

  web:
    image: ghcr.io/${IMAGE_OWNER}/ayandeh-school-web:${IMAGE_TAG}
    restart: unless-stopped
    ports: ["127.0.0.1:${WEB_PORT:-8080}:8080"]
    depends_on: [api]

volumes:
  pgdata:
  uploads:
  backups:
  clamdb:
