server {
  listen 8080;
  root /usr/share/nginx/html;
  client_max_body_size 100m;
  include /etc/nginx/security-headers.inc;

  location /api/ {
    include /etc/nginx/security-headers.inc;
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 120s;
  }
  location /assets/ { include /etc/nginx/security-headers.inc; add_header Cache-Control "public, max-age=31536000, immutable"; }
  location = /sw.js { include /etc/nginx/security-headers.inc; add_header Cache-Control "no-cache"; }
  location / { include /etc/nginx/security-headers.inc; try_files $uri /index.html; add_header Cache-Control "no-cache"; }
}
